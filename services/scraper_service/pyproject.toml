[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-service"
version = "0.1.0"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0"
]
security = [
    "bandit>=1.7.0",
    "safety>=2.0.0"
]
verify = [
    "PyYAML>=6.0.0"
]
all = [
    "pytest>=7.0.0",
    "httpx>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "PyYAML>=6.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

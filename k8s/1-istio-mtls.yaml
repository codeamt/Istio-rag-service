apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata: 
  name: rag-gateway 
  namespace: rag-system
spec: 
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default 
  namespace: rag-system
spec:
  mtls:
    mode: STRICT


apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: qdrant-pvc
  namespace: rag-system
spec: 
  accessModes: 
    - ReadWriteOnce
  resources:
    requests: 
      storage: 20Gi
  storageClassName: standard

---
#Qdrant Deployment (Cluster mode)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: rag-system
  labels: 
    app: qdrant

spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: qdrant
  template:
    metadata: 
      labels: 
        app: qdrant 
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        proxy.istio.io/config: |
          {
            "holdApplicationUntilProxyStarts": true
          }
    spec: 
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.8.0
        ports:
        - containerPort: 6333 #HTTP API
        - containerPort: 6334 #gRPC
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        volumeMounts:
        - name: qdrant-storage
          mountPath: /qdrant/storage
        livenessProbe:
          httpGet:
            path: /ready
            port: 6333
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe: 
          httpGet:
            path: /ready
            port: 6333
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: rag-system
spec:
  selector: 
    app: qdrant
  ports:
  - name: http
    port: 6333
    targetPort: 6333
  - name: grpc
    port: 6334
    targetPort: 6334


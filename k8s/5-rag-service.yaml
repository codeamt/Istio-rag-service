apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: rag-system
spec:
  selector:
    matchLabels:
      app: rag-service
  template: 
    spec: 
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
      - name: rag-service
        image: codeamt/istio-rag
        env:
        - name: VLLM_ENDPOINT
          value: "http://vllm:8000"
        - name: QDRANT_HOST
          value: "qdrant"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: rag-system
spec:
  selector:
    app: rag-service
  ports:
  - port: 8000
    targetPort: 8000
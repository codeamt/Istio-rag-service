apiVersion: apps/v1
kind: Deployment 
metadata:
  name: vllm
  namespace: rag-system
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: vllm 
  template:
    spec:
      containers: 
      - name: vllm
        image: vllm/vllm-openai:latest
        args: 
          - --model=microsoft/Phi-3-mini-4k-instruct
          - --quantization=awq
        resources:
          limits:
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: vllm 
  namespace: rag-system
spec:
  selector: 
    app: vllm
  ports:
  - port: 8000
    targetPort: 8000
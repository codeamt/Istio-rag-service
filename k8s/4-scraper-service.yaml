apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: scraper
  namespace: rag-system 
spec: 
  replicas: 1 
  selector:
    matchLabels:
      app: scraper
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
        - name: scraper 
          image: codeamt/istio-scraper 
          envFrom:
          - secretRef: 
              name: api-tokens
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service 
metadata:
  name: scraper
  namespace: rag-system 
spec:
  selector:
    app: scraper 
  ports:
  - port: 8000
    targetPort: 8000
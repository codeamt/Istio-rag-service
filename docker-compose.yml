version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # vLLM Service (using a lightweight model for local development)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    ports:
      - "8000:8000"
    command: [
      "--model", "facebook/opt-125m",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]
    # Note: GPU is not required for the lightweight model
    # For production with larger models, uncomment the GPU section below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Scraper Service
  scraper-service:
    build:
      context: ./services/scraper_service
      dockerfile: Dockerfile
    container_name: scraper-service
    ports:
      - "8001:8000"
    environment:
      - LOG_LEVEL=DEBUG
      - HTTP_TIMEOUT=30
      - BATCH_SIZE=5
    depends_on:
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RAG Service
  rag-service:
    build:
      context: ./services/rag_service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "8002:8000"
    environment:
      - LOG_LEVEL=DEBUG
      - HTTP_TIMEOUT=30
      - MAX_TOKENS=200
    depends_on:
      qdrant:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  qdrant_data:
